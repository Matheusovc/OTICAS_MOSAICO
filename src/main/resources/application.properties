spring.application.name=oticas-mosaico
server.port=8080

# Compressão das respostas (HTML, CSS, JS, JSON)
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,image/svg+xml

# Cache dos arquivos estáticos. Aumente em produção se versionar os arquivos (ex.: style.v2.css).
spring.web.resources.cache.cachecontrol.max-age=1h
